name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calc
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          BASE_PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)

          LATEST_TAG=$(git tag --list "v${MAJOR}.${MINOR}.*" --sort=-version:refname \
            | grep -E "^v${MAJOR}\.${MINOR}\.[0-9]+$" \
            | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            PATCH=$BASE_PATCH
          else
            LATEST_PATCH=$(echo "$LATEST_TAG" | sed "s/^v${MAJOR}\.${MINOR}\.//")
            PATCH=$((LATEST_PATCH + 1))
          fi

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            ext: .exe
            platform: windows
          - os: ubuntu-latest
            ext: .AppImage
            platform: linux
          - os: macos-latest
            ext: .dmg
            platform: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update version for build
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ needs.version.outputs.version }}';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: TokenUsage-v${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: dist/*${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --list "v*" --sort=-version:refname \
            | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" \
            | head -n1)

          cat > release-notes.md <<EOF
          ## 变更

          EOF

          if [ -z "$PREV_TAG" ]; then
            echo "* 初始发布" >> release-notes.md
          else
            git log "$PREV_TAG..HEAD" --oneline --no-decorate | while IFS= read -r line; do
              echo "* $line" >> release-notes.md
            done
          fi

          echo "" >> release-notes.md
          echo "### 使用方式" >> release-notes.md
          echo "" >> release-notes.md
          echo "下载对应系统的文件后运行即可。" >> release-notes.md

      - name: List artifacts
        run: ls -lhR dist-artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Token Usage v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist-artifacts/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
