<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5e9eff"/>
      <stop offset="50%" stop-color="#7c6df0"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e9eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5e9eff" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="url(#glow)" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow2)" stroke-width="32"/>

  <!-- Main hexagonal token shape -->
  <g filter="url(#shadow)">
    <!-- Hexagon -->
    <polygon points="256,120 370,176 370,336 256,392 142,336 142,176"
             fill="url(#bg)" stroke="url(#glow)" stroke-width="3"/>
  </g>

  <!-- Inner glowing hexagon ring -->
  <polygon points="256,148 346,192 346,320 256,364 166,320 166,192"
           fill="none" stroke="url(#glow)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Center T letter made of data bars -->
  <!-- T horizontal bar -->
  <rect x="216" y="218" width="80" height="8" rx="4" fill="url(#glow)"/>

  <!-- T vertical bar -->
  <rect x="246" y="218" width="20" height="64" rx="4" fill="url(#glow)"/>

  <!-- Data bar 1 - left bottom -->
  <rect x="190" y="270" width="32" height="6" rx="3" fill="#5e9eff" fill-opacity="0.5"/>
  <rect x="190" y="282" width="24" height="6" rx="3" fill="#5e9eff" fill-opacity="0.3"/>

  <!-- Data bar 2 - right bottom -->
  <rect x="290" y="270" width="32" height="6" rx="3" fill="#a855f7" fill-opacity="0.5"/>
  <rect x="290" y="282" width="24" height="6" rx="3" fill="#a855f7" fill-opacity="0.3"/>

  <!-- Animated dots around hexagon (static representation) -->
  <circle cx="256" cy="120" r="4" fill="#5e9eff"/>
  <circle cx="370" cy="176" r="4" fill="#7c6df0"/>
  <circle cx="370" cy="336" r="4" fill="#a855f7"/>
  <circle cx="256" cy="392" r="4" fill="#a855f7"/>
  <circle cx="142" cy="336" r="4" fill="#7c6df0"/>
  <circle cx="142" cy="176" r="4" fill="#5e9eff"/>

  <!-- Connecting circuit lines -->
  <line x1="142" y1="176" x2="216" y2="218" stroke="#5e9eff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="370" y1="176" x2="296" y2="218" stroke="#7c6df0" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="190" y1="290" x2="166" y2="320" stroke="#5e9eff" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="322" y1="290" x2="346" y2="320" stroke="#a855f7" stroke-width="1" stroke-opacity="0.15"/>
</svg>
